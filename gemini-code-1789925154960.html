<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROUND PLAY : BONUS EVENT - "9" TIMER Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Dosis:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #120926;
            --bg-night: #1f113a;
            --neon-pink: #ff2a8d;
            --neon-blue: #00f3ff;
            --neon-lime: #39ff14;
            --neon-yellow: #ffe600;
            --arcade-cabinet: #25164d;
            --screen-bg: #090314;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pixel Art Background & Retro Stars/Moon */
        .arcade-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #120926 0%, #29124a 50%, #0e051b 100%);
            z-index: -3;
        }

        .pixel-moon {
            position: absolute;
            top: 5vh;
            right: 10vw;
            width: clamp(60px, 8vw, 100px);
            height: clamp(60px, 8vw, 100px);
            background: #ffe57f;
            border-radius: 50%;
            box-shadow: 0 0 30px #ffca28, 0 0 60px rgba(255, 202, 40, 0.4);
            z-index: -2;
        }

        .pixel-stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--neon-yellow), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, var(--neon-pink), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 200px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 80px, var(--neon-blue), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            opacity: 0.8;
            z-index: -2;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 0.9; }
        }

        /* Main Cabinet Frame */
        .cabinet {
            width: 96vw;
            height: 94vh;
            max-width: 1750px;
            max-height: 980px;
            background: var(--arcade-cabinet);
            border: 8px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 42, 141, 0.5), inset 0 0 50px rgba(0,0,0,0.8);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        /* Header Marquee */
        .marquee {
            text-align: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid var(--neon-blue);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .marquee h1 {
            font-size: clamp(1rem, 1.8vw, 1.8rem);
            color: var(--neon-yellow);
            text-shadow: 3px 3px var(--neon-pink);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .marquee h2 {
            font-size: clamp(0.7rem, 1.2vw, 1.1rem);
            color: var(--neon-blue);
            letter-spacing: 1px;
        }

        /* Content Split Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 1100px) {
            .main-content {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
        }

        /* CRT Screen */
        .crt-screen {
            background-color: var(--screen-bg);
            border: 4px solid var(--neon-blue);
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            box-shadow: inset 0 0 40px rgba(0, 243, 255, 0.2);
            overflow: hidden;
            text-align: center;
        }

        .crt-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .crt-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            z-index: 11;
            pointer-events: none;
        }

        .screen-inner {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Leaderboard Panel */
        .leaderboard-panel {
            background: rgba(10, 5, 25, 0.85);
            border: 4px solid var(--neon-yellow);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 30px rgba(255, 230, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .lb-title {
            font-size: clamp(0.9rem, 1.4vw, 1.3rem);
            color: var(--neon-yellow);
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 2px 2px var(--neon-pink);
            letter-spacing: 1px;
        }

        .lb-table {
            width: 100%;
            border-collapse: collapse;
            flex: 1;
        }

        .lb-table th {
            font-size: clamp(0.5rem, 0.8vw, 0.75rem);
            color: var(--neon-blue);
            padding: 8px 4px;
            border-bottom: 2px dashed var(--neon-blue);
            text-align: left;
        }

        .lb-table td {
            font-size: clamp(0.55rem, 0.9vw, 0.85rem);
            padding: 10px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .rank-1 { color: var(--gold); text-shadow: 0 0 10px var(--gold); font-weight: bold; }
        .rank-2 { color: var(--silver); text-shadow: 0 0 8px var(--silver); }
        .rank-3 { color: var(--bronze); text-shadow: 0 0 8px var(--bronze); }
        .rank-other { color: #fff; }

        /* Game States UI */
        .game-title-lg {
            font-size: clamp(1.2rem, 2.2vw, 2rem);
            color: var(--neon-pink);
            text-shadow: 3px 3px var(--neon-yellow);
            margin-bottom: 20px;
            animation: pulse-title 1.5s infinite alternate;
        }

        @keyframes pulse-title {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .instruction {
            font-size: clamp(0.7rem, 1.1vw, 1rem);
            color: var(--neon-lime);
            margin-top: 15px;
            line-height: 1.6;
        }

        .sub-instruction {
            font-size: clamp(0.5rem, 0.8vw, 0.75rem);
            color: #aaa;
            margin-top: 8px;
        }

        .nickname-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 400px;
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border: 2px dashed var(--neon-blue);
            border-radius: 8px;
        }

        .nickname-box input {
            background: #000;
            border: 2px solid var(--neon-pink);
            color: var(--neon-yellow);
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.8rem, 1.2vw, 1.1rem);
            padding: 12px;
            text-align: center;
            border-radius: 4px;
            outline: none;
        }

        .nickname-box input:focus {
            border-color: var(--neon-lime);
            box-shadow: 0 0 10px var(--neon-lime);
        }

        .result-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90%;
            max-width: 450px;
            margin: 15px 0;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border: 2px solid var(--neon-blue);
            border-radius: 8px;
        }

        .result-item label {
            font-size: clamp(0.5rem, 0.7vw, 0.7rem);
            color: var(--neon-blue);
            display: block;
            margin-bottom: 5px;
        }

        .result-item val {
            font-size: clamp(0.9rem, 1.5vw, 1.3rem);
            color: var(--neon-yellow);
        }

        .badge-anim {
            font-size: clamp(1rem, 2vw, 1.8rem);
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: bounce-badge 0.5s infinite alternate;
        }

        @keyframes bounce-badge {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .high-score-banner {
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold), 0 0 30px var(--neon-pink);
            border: 3px solid var(--gold);
            background: rgba(255, 215, 0, 0.15);
        }

        .rank-in-banner {
            color: var(--neon-lime);
            text-shadow: 0 0 15px var(--neon-lime);
            border: 3px solid var(--neon-lime);
            background: rgba(57, 255, 20, 0.15);
        }

        .try-again-banner {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            border: 2px solid var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
        }

        /* Footer & Admin Controls */
        .arcade-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: clamp(0.45rem, 0.7vw, 0.65rem);
            color: #777;
        }

        .admin-controls {
            display: flex;
            gap: 8px;
        }

        .mode-switch {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 5px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .mode-switch:hover {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
        }

        .reset-btn {
            background: rgba(255, 42, 141, 0.2);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 5px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 10px var(--neon-pink);
        }
    </style>
</head>
<body>

    <div class="arcade-bg"></div>
    <div class="pixel-moon"></div>
    <div class="pixel-stars"></div>

    <div class="cabinet">
        <!-- Header Marquee -->
        <div class="marquee">
            <h1>GROUND PLAY : BONUS EVENT</h1>
            <h2>“9” TIMER Challenge</h2>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- CRT Game Screen -->
            <div class="crt-screen">
                <div class="screen-inner" id="screen-container">
                    <!-- Dynamic state content injected via JS -->
                </div>
            </div>

            <!-- Leaderboard Panel -->
            <div class="leaderboard-panel">
                <div class="lb-title">★ TOP 10 LEADERBOARD ★</div>
                <table class="lb-table">
                    <thead>
                        <tr>
                            <th>RANK</th>
                            <th>PLAYER</th>
                            <th>TIME</th>
                            <th>DIFF</th>
                        </tr>
                    </thead>
                    <tbody id="lb-tbody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <div class="arcade-footer">
            <span>PRESS [SPACE] TO START/STOP | [ENTER] TO SUBMIT | [ESC] TO HOME</span>
            <div class="admin-controls">
                <button class="reset-btn" onclick="resetLeaderboard()">⚙️ RESET RANK</button>
                <button class="mode-switch" onclick="toggleScreenMode()">SCREEN MODE: <span id="mode-label">SINGLE</span></button>
            </div>
        </div>
    </div>

    <script>
        // --- Sound Synthesizer (Web Audio API) ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'start') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'stop') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'highscore') {
                    [440, 554, 659, 880].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.1);
                        g.gain.setValueAtTime(0.2, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.2);
                    });
                } else if (type === 'rankin') {
                    [300, 400, 500].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.08);
                        g.gain.setValueAtTime(0.15, now + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.15);
                        o.start(now + i * 0.08);
                        o.stop(now + i * 0.08 + 0.15);
                    });
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        // --- Game State Management ---
        const CHANNEL_NAME = 'ground_play_9timer_channel';
        let bc = null;
        try {
            bc = new BroadcastChannel(CHANNEL_NAME);
            bc.onmessage = (event) => {
                if (event.data && event.data.type === 'SYNC_LEADERBOARD') {
                    leaderboard = event.data.data;
                    renderLeaderboard();
                }
            };
        } catch (e) {
            console.log('BroadcastChannel not supported');
        }

        let gameState = 'IDLE'; 
        let nickname = '';
        let startTime = 0;
        let lastResult = null;
        let leaderboard = JSON.parse(localStorage.getItem('ground_play_9timer_lb') || '[]');

        const screenContainer = document.getElementById('screen-container');
        const lbTbody = document.getElementById('lb-tbody');

        renderLeaderboard();
        renderScreen();

        function saveAndBroadcastLB() {
            localStorage.setItem('ground_play_9timer_lb', JSON.stringify(leaderboard));
            if (bc) {
                bc.postMessage({ type: 'SYNC_LEADERBOARD', data: leaderboard });
            }
        }

        // --- Reset Leaderboard Function ---
        function resetLeaderboard() {
            if (confirm('⚠️ [운영자 관리] 모든 랭킹 기록을 정말 초기화하시겠습니까?')) {
                leaderboard = [];
                saveAndBroadcastLB();
                renderLeaderboard();
                gameState = 'IDLE';
                renderScreen();
                alert('모든 리더보드 데이터가 리셋되었습니다.');
            }
        }

        function renderLeaderboard() {
            lbTbody.innerHTML = '';
            if (leaderboard.length === 0) {
                lbTbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#666; padding:20px;">NO RECORDS YET</td></tr>`;
                return;
            }

            leaderboard.forEach((item, index) => {
                let rankClass = 'rank-other';
                if (index === 0) rankClass = 'rank-1';
                else if (index === 1) rankClass = 'rank-2';
                else if (index === 2) rankClass = 'rank-3';

                const diffStr = (item.diff >= 0 ? '+' : '') + item.diff.toFixed(2);
                const rankNum = String(index + 1).padStart(2, '0');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="${rankClass}">${rankNum}</td>
                    <td class="${rankClass}" style="max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</td>
                    <td>${item.time.toFixed(2)}</td>
                    <td>${diffStr}</td>
                `;
                lbTbody.appendChild(row);
            });
        }

        function renderScreen() {
            screenContainer.innerHTML = '';

            if (gameState === 'IDLE') {
                screenContainer.innerHTML = `
                    <div class="game-title-lg">PLAYER READY?</div>
                    <div class="instruction">PRESS [SPACEBAR] TO ENTER NICKNAME</div>
                    <div class="sub-instruction">TARGET: STOP EXACTLY AT 9.00 SEC</div>
                `;
            } else if (gameState === 'INPUT_NAME') {
                screenContainer.innerHTML = `
                    <div class="game-title-lg" style="font-size: clamp(1rem, 1.8vw, 1.5rem);">ENTER NICKNAME</div>
                    <div class="nickname-box">
                        <input type="text" id="nickname-input" maxlength="10" placeholder="MAX 10 CHARS" autofocus autocomplete="off" />
                        <div class="sub-instruction" style="color:var(--neon-lime);">PRESS [ENTER] WHEN READY</div>
                    </div>
                `;
                setTimeout(() => {
                    const input = document.getElementById('nickname-input');
                    if (input) input.focus();
                }, 50);
            } else if (gameState === 'READY') {
                screenContainer.innerHTML = `
                    <div class="game-title-lg" style="color: var(--neon-yellow);">PLAYER: ${nickname}</div>
                    <div class="instruction" style="font-size: clamp(0.9rem, 1.4vw, 1.2rem); color: var(--neon-lime); margin-top: 20px;">
                        GET READY!
                    </div>
                    <div class="instruction" style="font-size: clamp(0.7rem, 1.1vw, 0.9rem); color: var(--neon-pink); margin-top: 15px;">
                        PRESS [SPACEBAR] TO START TIMER
                    </div>
                    <div class="sub-instruction" style="margin-top: 25px;">COUNTING WILL BE HIDDEN IMMEDIATELY</div>
                `;
            } else if (gameState === 'PLAYING') {
                screenContainer.innerHTML = `
                    <div class="game-title-lg" style="color: var(--neon-lime);">COUNTING...</div>
                    <div class="instruction" style="font-size: clamp(0.9rem, 1.5vw, 1.3rem); color: var(--neon-yellow);">
                        🔒 TIMER IS HIDDEN 🔒
                    </div>
                    <div class="sub-instruction" style="margin-top: 20px;">PRESS [SPACEBAR] WHEN YOU THINK IT'S 9.00 SEC</div>
                `;
            } else if (gameState === 'RESULT') {
                const diffStr = (lastResult.diff >= 0 ? '+' : '') + lastResult.diff.toFixed(2);
                
                let bannerHtml = '';
                if (lastResult.isNewHighScore) {
                    bannerHtml = `<div class="badge-anim high-score-banner">★ NEW HIGH SCORE! ★</div>`;
                } else if (lastResult.isRankIn) {
                    bannerHtml = `<div class="badge-anim rank-in-banner">★ RANK IN! TOP 10 ★</div>`;
                } else {
                    bannerHtml = `<div class="badge-anim try-again-banner">SO CLOSE! TRY AGAIN</div>`;
                }

                screenContainer.innerHTML = `
                    ${bannerHtml}
                    <div style="font-size: clamp(0.7rem, 1.1vw, 1rem); color: var(--neon-blue); margin-bottom: 10px;">PLAYER: ${lastResult.nickname}</div>
                    <div class="result-box">
                        <div class="result-item">
                            <label>YOUR TIME</label>
                            <val>${lastResult.time.toFixed(2)}</val>
                        </div>
                        <div class="result-item">
                            <label>TARGET</label>
                            <val>9.00</val>
                        </div>
                        <div class="result-item" style="grid-column: span 2;">
                            <label>DIFF (ABS ERROR)</label>
                            <val style="color: ${Math.abs(lastResult.diff) <= 0.05 ? 'var(--neon-lime)' : 'var(--neon-yellow)'};">${diffStr} sec</val>
                        </div>
                    </div>
                    <div class="instruction" style="font-size: clamp(0.55rem, 0.8vw, 0.75rem); color: #bbb;">
                        PRESS [ENTER] TO CONTINUE / [ESC] TO HOME
                    </div>
                `;
            }
        }

        // --- Keyboard Controls ---
        window.addEventListener('keydown', (e) => {
            // Admin Reset Shortcut: Ctrl + Shift + R
            if (e.ctrlKey && e.shiftKey && (e.key === 'R' || e.key === 'r')) {
                e.preventDefault();
                resetLeaderboard();
                return;
            }

            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'IDLE') {
                    playSound('start');
                    gameState = 'INPUT_NAME';
                    renderScreen();
                } else if (gameState === 'READY') {
                    gameState = 'PLAYING';
                    startTime = performance.now();
                    playSound('start');
                    renderScreen();
                } else if (gameState === 'PLAYING') {
                    const endTime = performance.now();
                    const rawTime = (endTime - startTime) / 1000;
                    const timeRounded = Math.round(rawTime * 100) / 100;
                    const diff = timeRounded - 9.00;
                    const absDiff = Math.abs(diff);

                    playSound('stop');

                    const newRecord = {
                        nickname: nickname.trim() || 'ANONYMOUS',
                        time: timeRounded,
                        diff: diff,
                        absDiff: absDiff,
                        timestamp: Date.now()
                    };

                    let isNewHighScore = false;
                    let isRankIn = false;

                    if (leaderboard.length === 0) {
                        isNewHighScore = true;
                        isRankIn = true;
                    } else if (absDiff < leaderboard[0].absDiff) {
                        isNewHighScore = true;
                        isRankIn = true;
                    } else if (leaderboard.length < 10 || absDiff < leaderboard[leaderboard.length - 1].absDiff) {
                        isRankIn = true;
                    }

                    leaderboard.push(newRecord);
                    leaderboard.sort((a, b) => {
                        if (a.absDiff !== b.absDiff) return a.absDiff - b.absDiff;
                        return a.timestamp - b.timestamp;
                    });

                    if (leaderboard.length > 10) {
                        leaderboard = leaderboard.slice(0, 10);
                    }

                    const assignedIndex = leaderboard.findIndex(item => item.timestamp === newRecord.timestamp);
                    const isActuallyInTop10 = assignedIndex !== -1;

                    saveAndBroadcastLB();
                    renderLeaderboard();

                    if (isNewHighScore && isActuallyInTop10) playSound('highscore');
                    else if (isActuallyInTop10) playSound('rankin');

                    lastResult = {
                        ...newRecord,
                        isNewHighScore: isNewHighScore && isActuallyInTop10,
                        isRankIn: isActuallyInTop10 && !isNewHighScore
                    };

                    gameState = 'RESULT';
                    renderScreen();
                }
            } else if (e.code === 'Enter') {
                e.preventDefault();
                if (gameState === 'INPUT_NAME') {
                    const input = document.getElementById('nickname-input');
                    if (input) {
                        const val = input.value.trim();
                        if (val.length === 0) {
                            alert('Please enter a nickname!');
                            return;
                        }
                        if (val.length > 10) {
                            alert('Nickname must be within 10 characters!');
                            return;
                        }
                        nickname = val;
                    } else {
                        nickname = 'PLAYER';
                    }

                    gameState = 'READY';
                    playSound('start');
                    renderScreen();
                } else if (gameState === 'RESULT') {
                    gameState = 'IDLE';
                    renderScreen();
                }
            } else if (e.code === 'Escape') {
                e.preventDefault();
                gameState = 'IDLE';
                renderScreen();
            }
        });

        document.addEventListener('submit', (e) => e.preventDefault());

        let screenMode = 'SINGLE';
        function toggleScreenMode() {
            if (screenMode === 'SINGLE') {
                screenMode = 'DUAL_GAME';
                document.getElementById('mode-label').innerText = 'GAME ONLY';
                document.querySelector('.leaderboard-panel').style.display = 'none';
                document.querySelector('.main-content').style.gridTemplateColumns = '1fr';
            } else if (screenMode === 'DUAL_GAME') {
                screenMode = 'DUAL_RANK';
                document.getElementById('mode-label').innerText = 'RANK ONLY';
                document.querySelector('.leaderboard-panel').style.display = 'flex';
                document.querySelector('.crt-screen').style.display = 'none';
                document.querySelector('.main-content').style.gridTemplateColumns = '1fr';
            } else {
                screenMode = 'SINGLE';
                document.getElementById('mode-label').innerText = 'SINGLE';
                document.querySelector('.leaderboard-panel').style.display = 'flex';
                document.querySelector('.crt-screen').style.display = 'flex';
                document.querySelector('.main-content').style.gridTemplateColumns = '1.1fr 0.9fr';
            }
        }
    </script>
</body>
</html>
